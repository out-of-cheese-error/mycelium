server {
    listen 80;
    server_name _;

    # Allow large file uploads (PDFs, documents for ingestion)
    client_max_body_size 50M;

    # Serve static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the backend (strips /api prefix)
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;

        # WebSocket support (for /api/call/ws → backend /call/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE streaming (chat responses)
        proxy_buffering off;
        proxy_cache off;

        # Increase timeouts for long-running LLM requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
