services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      # Persist Memory (Graph + Chroma + Notes) - configurable via .env
      - ${MEMORY_DATA_PATH:-./backend/memory_data}:/app/memory_data
      # Persist logs
      - ${LOGS_PATH:-./backend/logs}:/app/logs
      # Config persistence - mount directory instead of file to avoid issues
      - ${CONFIG_PATH:-./backend}:/app/config
    environment:
      - ALLOW_ORIGINS=*
      # Set the config file path to use the volume mount
      - LLM_CONFIG_FILE=/app/config/llm_config.json
      # Set the memory base directory
      - MEMORY_BASE_DIR=/app/memory_data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
