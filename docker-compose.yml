services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Allow the backend container to reach LLM services on the host machine
    # Use http://host.docker.internal:1234/v1 as the LLM base URL in settings
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist Memory (Graph + Chroma + Notes) - configurable via .env
      - ${MEMORY_DATA_PATH:-./backend/memory_data}:/app/memory_data
      # Persist logs
      - ${LOGS_PATH:-./backend/logs}:/app/logs
      # Config persistence - mount directory instead of file to avoid issues
      - ${CONFIG_PATH:-./backend}:/app/config
    environment:
      - ALLOW_ORIGINS=*
      # Set the config file path to use the volume mount
      - LLM_CONFIG_FILE=/app/config/llm_config.json
      # Set the memory base directory
      - MEMORY_BASE_DIR=/app/memory_data

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  tts:
    profiles: ["tts"]
    build: ./tts
    ports:
      - "8100:8100"
    volumes:
      # Persist HuggingFace model cache across restarts
      - ${TTS_CACHE_PATH:-tts_cache}:/app/hf_cache
      # Persist downloaded voice presets
      - ${TTS_VOICES_PATH:-tts_voices}:/app/voices
    environment:
      - MODEL_PATH=microsoft/VibeVoice-Realtime-0.5B
      - MODEL_DEVICE=cuda
      - VOICES_DIR=/app/voices/streaming_model
      - HF_HOME=/app/hf_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  tts_cache:
  tts_voices:
